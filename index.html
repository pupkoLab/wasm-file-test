<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebAssembly File Test</title>
</head>

<body>

<h1>WebAssembly File Test</h1>

<p>Select a text file:</p>

<input type="file" id="inputFile">

<button id="runButton" disabled>
    Run C++ program
</button>

<p id="status"></p>

<script>
var Module = {

    noInitialRun: true,

    onRuntimeInitialized: function () {
        document.getElementById("runButton").disabled = false;
        document.getElementById("status").textContent =
            "WebAssembly ready.";
    }
};
</script>

<script src="processor.js"></script>

<script>

document.getElementById("runButton").addEventListener(
    "click",
    async function () {

        const input = document.getElementById("inputFile");

        if (input.files.length === 0) {
            alert("Please select a file.");
            return;
        }

        document.getElementById("status").textContent =
            "Running...";

        const file = input.files[0];

        // Read the uploaded file from the browser
        const data = new Uint8Array(
            await file.arrayBuffer()
        );

        // Remove files from an earlier run, if they exist
        try {
            FS.unlink("/input.txt");
        } catch (e) {}

        try {
            FS.unlink("/output.txt");
        } catch (e) {}

        // Copy the uploaded file into
        // Emscripten's virtual filesystem
        FS.writeFile("/input.txt", data);

        // Run the C++ main() function
        Module.callMain([]);

        // Read the output file created by C++
        const outputData =
            FS.readFile("/output.txt");

        const outputText =
            new TextDecoder().decode(outputData);

        // Save the result temporarily in the browser
        // so results.html can access it
        sessionStorage.setItem(
            "outputText",
            outputText
        );

        // Go to the results page
        window.location.href =
            "results.html";
    }
);

</script>

</body>
</html>
