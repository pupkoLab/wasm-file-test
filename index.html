<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebAssembly File Test</title>
</head>

<body>

<h1>WebAssembly File Test</h1>

<p>Select a text file:</p>

<input type="file" id="inputFile">

<button id="runButton" disabled>
    Run C++ program
</button>

<p id="status"></p>

<!-- Our validation code -->
<script src="validation.js"></script>

<script>
var Module = {

    noInitialRun: true,

    onRuntimeInitialized: function () {
        document.getElementById("runButton").disabled = false;
        document.getElementById("status").textContent =
            "WebAssembly ready.";
    }
};
</script>

<!-- Emscripten generated code -->
<script src="processor.js"></script>

<script>

document.getElementById("runButton").addEventListener(
    "click",
    async function () {

        const input = document.getElementById("inputFile");
        const file = input.files[0];

        // -----------------------------------
        // Validate BEFORE running C++
        // -----------------------------------

        const validation = await validateInputFile(file);

        if (!validation.valid) {
            alert(validation.message);
            return;
        }

        // -----------------------------------
        // Validation succeeded
        // -----------------------------------

        document.getElementById("status").textContent =
            "Running...";

        // Read uploaded file
        const data = new Uint8Array(
            await file.arrayBuffer()
        );

        // Remove files from previous run
        try {
            FS.unlink("/input.txt");
        } catch (e) {}

        try {
            FS.unlink("/output.txt");
        } catch (e) {}

        // Put input into Emscripten virtual filesystem
        FS.writeFile("/input.txt", data);

        // Run C++
        Module.callMain([]);

        // Read output generated by C++
        const outputData =
            FS.readFile("/output.txt");

        const outputText =
            new TextDecoder().decode(outputData);

        // Store result for results.html
        sessionStorage.setItem(
            "outputText",
            outputText
        );

        // Go to results page
        window.location.href =
            "results.html";
    }
);

</script>

</body>
</html>
